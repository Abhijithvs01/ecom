{% load static %}

<head>
    <link rel="apple-touch-icon" href="{% static 'img/icon.png' %}">
<link rel="shortcut icon" type="image/x-icon" href="{% static 'img/icon.ico' %}">

<link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
<link rel="stylesheet" href="{% static 'css/templatemo.css' %}">
<link rel="stylesheet" href="{% static 'css/custom.css' %}">
<link rel="stylesheet" href="{% static 'css/fontawesome.min.css' %}">
    <!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="apple-touch-icon" href="{% static 'img/icon.png' %}">
<link rel="shortcut icon" type="image/x-icon" href="{% static 'img/icon.ico' %}">

<link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
<link rel="stylesheet" href="{% static 'css/templatemo.css' %}">
<link rel="stylesheet" href="{% static 'css/custom.css' %}">
<link rel="stylesheet" href="{% static 'css/fontawesome.min.css' %}">

    <!-- Load fonts style after rendering the layout styles -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;200;300;400;500;700;900&display=swap">
<link rel="stylesheet" href="{% static 'css/fontawesome.min.css' %}">


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</head>

<nav class="navbar navbar-expand-lg navbar-light shadow">
    <div class="container d-flex justify-content-between align-items-center">

    <a class="navbar-brand text-success logo h1 align-self-center" href="{% url 'home' %}">
        Klavix
    </a>

    <button class="navbar-toggler border-0" type="button"
            data-bs-toggle="collapse"
            data-bs-target="#templatemo_main_nav"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
    </button>

    <div class="align-self-center collapse navbar-collapse flex-fill d-lg-flex justify-content-lg-between"
         id="templatemo_main_nav">

        <div class="flex-fill">
            <ul class="nav navbar-nav d-flex justify-content-between mx-lg-auto">
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'home' %}">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'about' %}">About</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'products' %}">Shop</a>
                </li>

                {% if user.is_authenticated %}
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'order' %}">Orders</a>
                </li>
                {% endif %}
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'contact' %}">Contact</a>
                </li>
            </ul>
        </div>

        <div class="navbar align-self-center d-flex align-items-center">

            <!-- Mobile Search -->
            <div class="d-lg-none flex-sm-fill mt-3 mb-4 col-7 col-sm-auto pr-3">
                <div class="input-group">
                    <input type="text"
                           class="form-control"
                           id="inputMobileSearch"
                           placeholder="Search ...">
                    <div class="input-group-text">
                        <i class="fa fa-fw fa-search"></i>
                    </div>
                </div>
            </div>

            <!-- Desktop Search -->
            <form class="d-none d-lg-flex me-3 align-items-center"
                  method="GET"
                  action="{% url 'search' %}"
                  style="margin-top:3px;">

                <div class="position-relative">
                    <input type="text"
                           class="form-control form-control-sm rounded-pill ps-3 pe-5"
                           name="q"
                           placeholder="Search..."
                           value="{{ request.GET.q }}"
                           style="width:140px;">

                    <button type="submit"
                            class="btn position-absolute top-50 end-0 translate-middle-y border-0 bg-transparent p-0 me-3">
                        <i class="fa fa-search text-success small"></i>
                    </button>
                </div>
            </form>

            <!-- Cart -->
            <a class="nav-icon position-relative text-decoration-none"
               href="{% url 'cart' %}">
                <i class="fa fa-fw fa-cart-arrow-down text-dark mr-1"></i>
                <span class="position-absolute top- left-100 translate-middle badge rounded-pill bg-light text-dark">{{ cart_count }}</span>
            </a>

            {% if user.is_authenticated %}

            <!-- Profile -->
            <a href="{% url 'profile' %}" class="text-decoration-none ms-3">
                <span class="text-dark">
                    Hello, {{ user.username }}
                </span>
            </a>

            <!-- Logout -->
            <a class="nav-icon text-decoration-none ms-3"
               href="{% url 'logout' %}"
               title="Logout">
                <i class="fa fa-sign-out-alt text-danger"></i>
            </a>

            {% else %}

            <!-- Login -->
            <a class="nav-icon position-relative text-decoration-none ms-3"
               href="{% url 'account' %}">
                <i class="fa fa-fw fa-user text-dark mr-3"></i>
                <span class="position-absolute top-0 left-100 translate-middle badge rounded-pill bg-light text-dark"></span>
            </a>

            {% endif %}

        </div>

    </div>

</div>

</nav>
