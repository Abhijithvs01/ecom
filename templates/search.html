{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Search Results</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="apple-touch-icon" href="{% static 'img/icon.png' %}">
    <link rel="shortcut icon" type="image/x-icon" href="{% static 'img/icon.ico' %}">

    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/templatemo.css' %}">
    <link rel="stylesheet" href="{% static 'css/custom.css' %}">
    <link rel="stylesheet" href="{% static 'css/fontawesome.min.css' %}">

    <!-- Load fonts style after rendering the layout styles -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;200;300;400;500;700;900&display=swap">
    <link rel="stylesheet" href="{% static 'css/fontawesome.min.css' %}">


    <!-- Bootstrap (if not already included) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .search-title {
            color: #198754; /* Bootstrap green */
            font-weight: bold;
        }

        .product-card {
            border: 1px solid #198754;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            transition: 0.3s;
            text-align: center;
        }

        .product-card:hover {
            background-color: #e9f7ef;
            transform: scale(1.02);
        }

        .price {
            color: #198754;
            font-weight: bold;
        }
        .product-card img {
            width: 100%;
            height: 250px;
            object-fit: contain;
            border-radius: 10px;
            margin-top: 10px;
        }
    </style>
</head>

<body class="container mt-4">

    <h2 class="search-title">Search Results</h2>

    {% if query %}
        <p>Results for: <b>{{ query }}</b></p>
    {% endif %}

    <div class="row mt-3">

        {% for product in products %}
            <div class="col-md-3">
                <div class="product-card">
                    <img src="{{ product.image.url }}" alt="product">
                    <h5>{{ product.title }}</h5>
                    <p class="price">₹ {{ product.price }}</p>
                    <form method = "post"  action="{% url 'add_to_cart' %}">
                        {% csrf_token %}
                    <input type="hidden" name="product_id" value="{{product.id}}">
                    <div class="mb-4">
                        <label class="form-label fw-bold">Size</label>
                        <select name="size" class="form-select">
                            <option value="S">Small (S)</option>
                            <option value="M">Medium (M)</option>
                            <option value="L">Large (L)</option>
                            <option value="XL">Extra Large (XL)</option>
                        </select>
                    </div>

                    <!-- Quantity -->
                    <div class="mb-4">
                        <input
                            type="hidden"
                            name="quantity"
                            value="1"
                            min="1"
                            class="form-control"
                        >
                    </div>

                    <!-- Buttons -->
                    <div class="d-grid gap-2">
                        <button type="submit"
                                name="action"
                                value="cart"
                                class="btn btn-success btn-lg">
                            🛒 Add To Cart
                        </button>

                        <button type="submit"
                                name="action"
                                value="buy"
                                class="btn btn-outline-success btn-lg">
                            ⚡ Buy Now
                        </button>
                        </div>
                    </form>
                </div>
            </div>
        {% empty %}
            <p class="text-danger">No products found.</p>
        {% endfor %}

    </div>

</body>
</html>
